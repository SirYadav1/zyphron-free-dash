<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Zyphron - free game server hosting panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2b45" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="98" font-size="13" font-weight="600" letter-spacing="4.5" fill="#60a5fa">GAME SERVER HOSTING PANEL</text>
    <text x="68" y="180" font-size="80" font-weight="700" letter-spacing="-1.5" fill="#f0f4ff">Zyphron</text>
    <text x="72" y="220" font-size="18" fill="#94a3b8">Free game servers, paid with coins users earn.</text>
    <text x="72" y="246" font-size="18" fill="#94a3b8">NestJS API, Vue 3 dashboard, Pterodactyl underneath.</text>

    <g font-size="12" font-weight="500" fill="#cbd5e1">
      <rect x="72" y="272" width="78" height="28" rx="14" fill="#0d1a2f" stroke="#1e3557"/>
      <text x="111" y="290" text-anchor="middle">NestJS</text>
      <rect x="160" y="272" width="70" height="28" rx="14" fill="#0d1a2f" stroke="#1e3557"/>
      <text x="195" y="290" text-anchor="middle">Vue 3</text>
      <rect x="240" y="272" width="74" height="28" rx="14" fill="#0d1a2f" stroke="#1e3557"/>
      <text x="277" y="290" text-anchor="middle">SQLite</text>
      <rect x="324" y="272" width="112" height="28" rx="14" fill="#0d1a2f" stroke="#1e3557"/>
      <text x="380" y="290" text-anchor="middle">Pterodactyl</text>
    </g>
  </g>

  <g transform="translate(1090 160)">
    <circle r="108" fill="#0a1628" fill-opacity="0.85" stroke="#1b2b45"/>
    <circle r="108" fill="none" stroke="url(#mark)" stroke-opacity="0.4" stroke-dasharray="2 9"/>
    <circle r="78" fill="none" stroke="#1b2b45"/>
    <text y="46" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="128" font-weight="700" fill="url(#mark)">Z</text>
    <circle cx="76" cy="-76" r="4" fill="#60a5fa"/>
    <circle cx="-84" cy="66" r="3" fill="#2563eb"/>
  </g>

  <rect x="0" y="317" width="1280" height="3" fill="url(#edge)"/>
</svg>
