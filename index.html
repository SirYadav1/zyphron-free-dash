<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" id="favicon-tag" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zyphron Cloud — Client Area</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/client/main.js"></script>
    <script>
      (async () => {
        try {
          const res = await fetch('/api/public-settings')
          const data = await res.json()
          if (data.favicon_url) {
            const link = document.getElementById('favicon-tag')
            if (link) {
              link.href = data.favicon_url
            }
          }
        } catch {}
      })()
    </script>
  </body>
</html>
